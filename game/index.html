<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Kaitiaki — from the street to the sea</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <div class="brand"><h1>KAITIAKI</h1><span id="scale"></span></div>
  <div id="steps" class="steps"></div>
  <div class="head-r"><span id="date"></span><button id="end" class="primary">End season ▸</button><button id="menu" title="New game">⟲</button></div>
</header>
<div id="stats" class="stats"></div>
<main>
  <aside class="left">
    <details class="sec" open><summary>Objective</summary><p id="goal"></p></details>
    <details class="sec" open><summary>Kaupapa</summary><div id="policies"></div></details>
    <details class="sec" open><summary>Powers and partners</summary><div id="meters"></div></details>
    <details class="sec" open><summary>Log</summary><div id="log" class="log"></div></details>
  </aside>
  <div class="centre">
    <div id="scene" class="scene"></div>
    <div class="bar"><div id="tabs" class="tabs"></div><div id="slots" class="slots"></div></div>
    <div id="active" class="active"></div>
    <div id="cards" class="cards"></div>
    <details id="horizon" class="horizon"><summary>On the horizon</summary><div id="horizon-list"></div></details>
  </div>
</main>
<div id="modal" class="modal"><div class="box"><h2 id="m-title"></h2><p id="m-text"></p><div id="m-choices"></div></div></div>
<script>if (innerWidth < 860) document.querySelectorAll("details.sec").forEach(d => d.removeAttribute("open"));</script>
<script src="data.js"></script>
<script src="engine.js"></script>
<script src="play.js"></script>
<script src="view.js"></script>
<script src="ui.js"></script>
</body>
</html>
